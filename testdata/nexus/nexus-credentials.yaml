apiVersion: v1
kind: Secret
metadata:
  name: nexus-credentials
type: Opaque
stringData:
  # A throwaway Ed25519 private key, in the form `nexus-generate-key
  # --keypair` writes it: verbatim, including the "Ed25519:" prefix. Only
  # this client holds the private half; the matching public key goes on the
  # Nexus server in plaintext, as
  # nexus.server.challenge-public-keys.example:
  #   Ed25519:MCowBQYDK2VwAyEAByVb8kEpW/BFrnFuF9InXczp5j7/GE48hV1scQgW1nk=
  private-key: Ed25519:MC4CAQAwBQYDK2VwBCIEIDL0bHQ3xEWaFliOjuOLaGo8cWZm6eJ2JcpWLuqB5iyN

  # Legacy: the shared HMAC secret, base64-encoded. Used only by the
  # apikeysecret path (/api/v2); the server holds a copy of this one.
  api-key: Th9YZzKkihOzCuv1RHCzftcPfx7J/cAARXz0c4jYsR07iOdb/v5Gt8clnCDi+vn8Rtn8QC1Fjq5wcrlY6yEAbg==
